name: CodeQL

# Static security analysis for the auth / SQL-execution surfaces (and the SPA).
# Free on public repositories; results appear under the Security tab. Runs on PRs
# and pushes to main and to the release epic branch, plus a weekly sweep for
# newly-published queries.
on:
  push:
    # epic/v0.5.1 is the v0.5.1 epic branch, mirroring ci.yml: sub-PRs merge into
    # it rather than main, so without it here they would arrive at main as one
    # unanalysed diff.
    # Remove this line once the epic merges to main and the branch is deleted.
    branches: [main, epic/v0.5.1]
  pull_request:
    branches: [main, epic/v0.5.1]
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Same reasoning as ci.yml's per-job timeouts: GitHub's default is six hours,
    # so a wedged runner would hold a required check open indefinitely and block
    # every merge. Both matrix legs finish in ~1 minute; 20 is generous room for a
    # cold CodeQL database build. (GitHub's own starter sets 360 — far too loose
    # to catch a stall on a repo this size.)
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        with:
          languages: ${{ matrix.language }}
          # security-extended: a superset of the default `security` suite (more
          # security queries), WITHOUT the `security-and-quality` suite's style/
          # maintainability queries (unnecessary-lambda, cyclic-import, import
          # style, etc.) — those are noise here; ruff already owns Python style.
          queries: security-extended
          # Excludes test code (not the deployed attack surface) — see paths-ignore.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.6

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
